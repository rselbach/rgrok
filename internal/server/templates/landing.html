<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rgrok</title>
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --bg-soft: #f9fafb;
  --text: #1f2328;
  --text-strong: #0c0c0d;
  --muted: #6b7280;
  --accent: #1563ff;
  --accent-strong: #1051d8;
  --accent-soft: #e7eeff;
  --warn-text: #92400e;
  --warn-soft: #fef6e6;
  --line: #e5e7eb;
  --line-strong: #d1d5db;
  --radius: 8px;
  --radius-lg: 12px;
  --shadow: 0 1px 3px rgba(15, 23, 42, 0.08), 0 4px 12px rgba(15, 23, 42, 0.05);
  --shadow-lg: 0 20px 50px rgba(15, 23, 42, 0.12);
}
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
  background: var(--bg-soft);
  color: var(--text);
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.card {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 48px;
  max-width: 440px;
  width: calc(100% - 48px);
  text-align: center;
  box-shadow: var(--shadow-lg);
}

.brand {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 24px;
}
.brand svg { color: var(--accent); }
.brand-name {
  font-size: 1.75rem;
  font-weight: 700;
  color: var(--text-strong);
  letter-spacing: -0.02em;
}

.tagline {
  color: var(--muted);
  margin: 0 0 32px;
  font-size: 1rem;
}

.notice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px 14px;
  border-radius: var(--radius);
  background: var(--warn-soft);
  border: 1px solid rgba(146, 64, 14, 0.15);
  color: var(--warn-text);
  font-size: 13px;
  line-height: 1.5;
  text-align: left;
  margin-bottom: 28px;
}
.notice svg { flex: 0 0 auto; margin-top: 1px; }
.notice strong { color: var(--warn-text); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 20px;
  border-radius: var(--radius);
  border: 1px solid var(--accent);
  background: var(--accent);
  color: #fff;
  text-decoration: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: background 0.15s, border-color 0.15s;
}
.btn:hover {
  background: var(--accent-strong);
  border-color: var(--accent-strong);
  text-decoration: none;
}
.btn svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
    </svg>
    <span class="brand-name">rgrok</span>
  </div>
  <p class="tagline">Public tunnels for private ports.</p>
  <div class="notice">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <path d="M12 9v4"/>
      <path d="M12 17h.01"/>
    </svg>
    <span><strong>Private service.</strong> Only whitelisted GitHub accounts can sign in. If your account is not on the whitelist, access will be denied even after authorization.</span>
  </div>
  <a class="btn" href="/login/github">

</div>
</body>
</html>
